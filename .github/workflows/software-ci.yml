name: Software CI

# Builds and smoke-tests the software side (sw/): the C++ engine, the FastAPI
# service, and the React UI. The RTL has its own manual-only workflow (ci.yml).
on:
  pull_request:
    paths:
      - "sw/**"
      - ".github/workflows/software-ci.yml"
  push:
    branches: [main]
    paths:
      - "sw/**"
      - ".github/workflows/software-ci.yml"
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: software-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sw/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pybind11
        run: python3 -m pip install pybind11

      - name: Build online CLI
        run: make

      - name: C++ unit tests
        run: make test

      - name: Build Python module
        run: make pymodule

      - name: Python binding tests
        run: make test-python

      - name: Offline simulation via Python
        run: |
          python3 -c "
          import engine_sim
          r = engine_sim.OfflineSimulation('../data_pipeline/data/synthetic_mbo_stream.bin').run()
          print('trades:', r.total_trades, 'pnl samples:', len(r.pnl_curve))
          assert len(r.pnl_curve) > 0, 'offline sim produced no PnL samples'
          "

      - name: Online simulation smoke test (loopback, unpaced)
        run: |
          ./online_run ../data_pipeline/data/flood_book.bin 0 50001 50001 127.0.0.1 | tee online.log
          grep -q "Simulation finished successfully" online.log

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sw/service/requirements.txt

      - name: Install dependencies
        run: python3 -m pip install pybind11 -r sw/service/requirements.txt

      - name: Build engine module
        run: make -C sw/engine pymodule

      - name: Start the service
        working-directory: sw/service/src
        env:
          CT_DB_PATH: ${{ runner.temp }}/ci.db
        run: |
          uvicorn app:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          echo "Service never came up:"; cat "$RUNNER_TEMP/uvicorn.log"; exit 1

      - name: Exercise the endpoints
        run: |
          set -e
          curl -sf http://127.0.0.1:8000/datasets
          curl -sf -X POST http://127.0.0.1:8000/simulate \
            -H 'content-type: application/json' \
            -d '{"data_file": "synthetic_mbo_stream.bin", "trade_limit": 5, "pnl_limit": 5}' \
            | python3 -c "import sys, json; d = json.load(sys.stdin); print('total_trades:', d['total_trades']); assert d['pnl_curve']"
          # The run above must have been logged to the database.
          curl -sf "http://127.0.0.1:8000/runs?limit=1" \
            | python3 -c "import sys, json; assert len(json.load(sys.stdin)) == 1"

      - name: Service log
        if: always()
        run: cat "$RUNNER_TEMP/uvicorn.log" || true

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sw/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sw/ui/package-lock.json

      - run: npm ci
      - run: npm run build
