# Quick "is the board alive" smoke test -- run with `make hw-smoke-test`
# (drives online_run, not the socket_test/test_online loopback binaries,
# since those only speak TCP). Requires the host <-> FPGA link already set up
# per docs/connection-test.md.
#
# Addressing is fixed by the RTL, not a choice -- must match
# docs/connection-test.md's addressing table.

[network]
itch_address   = 192.168.0.1
itch_port      = 50001
ouch_port      = 50001
ouch_transport = udp

[data]
market_book = tests/data/smoke_book.bin

[timing]
# 1.0 = real time: 10 orders, 100ms apart -- watch tcpdump/the activity LED
# for ~1s of OUCH responses per docs/connection-test.md step 4.
time_scale = 1.0
