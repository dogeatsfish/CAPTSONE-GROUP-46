# Config for tests/src/test_online.cpp (OnlineSimulation end-to-end test).
#
# This is a software-only loopback test, not a hardware target -- it does not
# use OnlineSimulation::Config's FPGA-oriented defaults (192.168.0.1, UDP).
# See sw/engine/simulation/include/online_simulation.h for what each of these
# maps to on the Config struct.

[network]
itch_address   = 127.0.0.1
itch_port      = 27100
ouch_port      = 27101
# udp | tcp -- the test's OUCH client only speaks TCP right now (see
# connect_ouch() in test_online.cpp), so this must stay "tcp".
ouch_transport = tcp

[data]
market_book = tests/data/market_ladder.bin

[timing]
# 1.0 = real time; the 100-order ladder streams over ~5s.
time_scale = 1.0
