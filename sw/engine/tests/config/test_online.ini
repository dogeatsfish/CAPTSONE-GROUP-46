# Config for tests/src/socket_test.cpp's "test-online" scenario -- the
# fullest end-to-end check: verifies the ITCH broadcast (not just OUCH),
# and checks each OUCH response's exact type, not just a trade count.
#
# This is a software-only loopback test, not a hardware target -- it does not
# use OnlineSimulation::Config's FPGA-oriented defaults (192.168.0.1, UDP).
# See sw/engine/simulation/include/online_simulation.h for what each of these
# maps to on the Config struct.

[network]
itch_address   = 127.0.0.1
itch_port      = 27100
ouch_port      = 27101
# udp | tcp -- the test's OUCH client only speaks TCP right now (see
# connect_ouch() in socket_test.cpp), so this must stay "tcp".
ouch_transport = tcp

[data]
market_book = ../data_pipeline/data/market_ladder.bin

[timing]
# 1.0 = real time; the 100-order ladder streams over ~5s.
time_scale = 1.0
# Shorter than socket_test.ini's default (1000ms) -- only need the first bid
# @100.00 resting before acting.
pre_send_delay_ms = 500

[orders]
# order1: SELL @ 100.00 crosses the first resting bid -> must execute.
order1_price  = 100.00
order1_expect = EXECUTED
# order2: SELL @ 200.00 is above every bid in the ladder -> can't cross,
# rests in the book instead.
order2_price  = 200.00
order2_expect = ACCEPTED

[assertions]
# Only the executing SELL produces a trade; the resting SELL does not.
min_trades  = 1
max_trades  = 1
verify_itch = true
