# Flood/stress config for tests/src/socket_test.cpp -- same rising-bid-ladder
# shape as socket_test.ini's book, just far denser (see
# data_pipeline/src/gen_test_datasets.py). Loopback/TCP, not a hardware config.

[network]
itch_address   = 127.0.0.1
itch_port      = 27300
ouch_port      = 27301
ouch_transport = tcp

[data]
market_book = ../data_pipeline/data/flood_book.bin

[timing]
# 1.0 = real time: the 5000-order ladder streams over ~5s.
time_scale = 1.0
